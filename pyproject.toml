[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synop"
dynamic = ["version"]
description = "package to handle meteorological reports"
#long_description = file: src/README_package.md
#long_description_content_type = text/markdown
authors = [{name = "Kolja Wagner", email = "k.wagner@meteo.uni-hannover.de"}]
requires-python = ">=3.10"
dependencies = [
    "numpy >= 2",
    "pandas >= 2",
    "xarray >= 2023",
    "netcdf4 >= 1.6",
    "scipy >= 1.10",
    "matplotlib >= 3.7",
    "pysolar >=0.11",
    "pint >= 0.20",
    "tqdm >= 4.66",
    "uncertainties >= 3",
    "httpx",   
]

#[project.optional-dependencies]
#doc = [
#    "sphinx >= 5.3.0",
#    "myst-parser >= 0.18.1",
#    "myst_nb >= 0.17.2",
#    "pydata-sphinx-theme >= 0.14.2", 
#    "sphinx-copybutton >= 0.5",
#    "sphinx-togglebutton >= 0.3",
#    "sphinx_design >= 0.6",
#]
#dev = [
#    "pytest >= 7.4",
#    "pytest-cov >= 4.1",
#    "isort >= 5.12.0",
#    "flake8 >= 6.0.0",
#    "Flake8-pyproject >= 1.2"
#]

[tool.setuptools.packages.find]
where = ["src/"]
include = ["synop"] 

[tool.setuptools.dynamic]
version = {attr = "synop.__version__"}


[tool.pytest.ini_options]
addopts = "--cov=synop"
testpaths = [
    "tests",
]
filterwarnings = [
    "ignore::DeprecationWarning"
]

[tool.coverage.run]

[tool.isort]
skip = [".gitignore",]

[tool.flake8]
extend-ignore = ["E203", "W293", "F401"]
max-line-length = 100
per-file-ignores = [
    "__init__.py:F401"
    ]
exclude = [".git",".tox",".idea",".ipynb_checkpoints","__pycache__"]
max-complexity = 10